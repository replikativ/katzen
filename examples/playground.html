<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>katzen — string-diagram playground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12/dist/style.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #app { height: 100%; }
  body { font-family: monospace; }
</style>
</head>
<body>
<div id="app">loading…</div>
<!-- mermaid is large + has a diagram-type graph shadow-cljs can't bundle, so we
     load it from CDN here and hand it to the app via window.mermaid (the second
     rendering functor; see katzen.playground/mermaid-view). -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
                       flowchart: { htmlLabels: true, curve: 'basis' } });
  window.mermaid = mermaid;
</script>
<script src="/dist/playground/playground.js"></script>
</body>
</html>
