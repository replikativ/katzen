name: Render Clay Notebooks + Playground

# Single GitHub Pages deployment for the whole site:
#   /            — Clay notebooks index
#   /playground/ — the ClojureScript string-diagram playground (shadow-cljs release)
# (Pages serves ONE site; both must deploy from here, or they clobber each other.)

on:
  push:
    branches: [main]
    paths:
      - 'dev/notebooks/**'
      - 'src/**'
      - 'deps.edn'
      - 'examples/playground.html'
      - 'package.json'
      - 'shadow-cljs.edn'
      - '.github/workflows/clay-notebooks.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  render-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deploy-pages@v4 requires the job to declare the github-pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.12.0.1488

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-maven-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download Clojure dependencies
        run: clojure -P -M:dev

      - name: Build the string-diagram playground (shadow-cljs release)
        run: |
          npm ci
          npx shadow-cljs release playground

      - name: Render Clay notebooks
        run: |
          clojure -M:dev -e "
          (require '[scicloj.clay.v2.api :as clay])

          (def notebooks
            [\"dev/notebooks/comparison_with_catlab.clj\"
             \"dev/notebooks/migration_demo.clj\"])

          (doseq [nb notebooks]
            (println \"Rendering\" nb)
            (clay/make! {:source-path nb
                         :base-target-path \"_site\"
                         :show false}))

          (spit \"_site/index.html\"
                \"<html><head><style>
                   body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
                   h1 { margin-bottom: 0.3em; }
                   ul { line-height: 2; }
                   a { color: #1a6; }
                 </style></head><body>
                 <h1>Katzen Notebooks</h1>
                 <p>Walkthroughs rendered from <a href='https://github.com/replikativ/katzen'>source</a>.</p>
                 <ul>
                   <li><a href='playground/'>String-diagram playground</a> — paste a Clojure <code>defn</code>, see its string diagram (interactive + mermaid)</li>
                   <li><a href='notebooks.comparison_with_catlab.html'>Comparison with Catlab</a> — side-by-side with the Julia stack</li>
                   <li><a href='notebooks.migration_demo.html'>Schema-driven migration</a> — Δ-migration walkthrough</li>
                 </ul></body></html>\")

          (println \"Done.\")
          (System/exit 0)
          "

      - name: Assemble the playground under /playground/
        run: |
          mkdir -p _site/playground/dist/playground
          cp dist/playground/playground.js _site/playground/dist/playground/
          # Served from /katzen/playground/, so use a relative script path.
          sed 's#/dist/playground/playground.js#./dist/playground/playground.js#' \
            examples/playground.html > _site/playground/index.html
          # Serve the artifact as-is — no Jekyll/Liquid processing.
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
